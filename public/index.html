<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Connection / Join Overlay -->
    <div id="connection-overlay" class="overlay">
        <div class="connect-container">
            <h1 class="system-title">SYSTEM_LINK</h1>
            <input id="join-input" class="name-input" autocomplete="off" maxlength="24" placeholder="ENTER CALLSIGN" />
            <button id="connect-btn" class="connect-btn">
                <span class="btn-text">INITIALIZE CONNECTION</span>
                <div class="pulse-ring"></div>
            </button>
        </div>
        <div class="room-code-box">
            <label for="room-input">ROOM</label>
            <input id="room-input" autocomplete="off" maxlength="24" placeholder="lobby" />
        </div>

        <!-- Full-dive connection sequence: hidden until Initialize Connection is clicked -->
        <div id="dive-sequence" aria-hidden="true">
            <div id="dive-ring"></div>
            <canvas id="dive-canvas"></canvas>
            <div id="dive-status"></div>
        </div>
    </div>

    <!-- Self-destruct countdown banner -->
    <div id="burn-banner">
        <span id="burn-banner-text"></span>
    </div>

    <!-- Self-destruct takeover screen -->
    <div id="burn-overlay" class="overlay">
        <div class="connect-container">
            <h1 class="system-title">SELF-DESTRUCT COMPLETE</h1>
            <p class="burn-message">Room memory purged. Connection terminated.</p>
            <button id="burn-reload-btn" class="connect-btn">
                <span class="btn-text">RE-ESTABLISH CONNECTION</span>
            </button>
        </div>
    </div>

    <!-- Code Sandbox Modal -->
    <div id="sandbox-overlay" class="sandbox-overlay">
        <div class="sandbox-modal">
            <div class="sandbox-header">
                <span class="sandbox-title">SANDBOX</span>
                <div class="sandbox-actions">
                    <button id="sandbox-reset" type="button" class="sandbox-reset">⟲ Reset</button>
                    <button id="sandbox-close" type="button" class="sandbox-close">✕</button>
                </div>
            </div>
            <iframe id="sandbox-frame" class="sandbox-frame" sandbox="allow-scripts"></iframe>
        </div>
    </div>

    <!-- Language Selection Header -->
    <div id="top-bar">
        <label for="lang-select">Translate incoming messages to:</label>
        <select id="lang-select">
            <option value="en">Loading languages...</option>
        </select>
    </div>

    <!-- Identity Control -->
    <div id="identity-menu">
        <button id="identity-toggle" type="button">•••</button>
        <div id="identity-panel">
            <span id="identity-label">Signed in as</span>
            <strong id="identity-name">—</strong>
            <span id="identity-label">Room</span>
            <strong id="identity-room">—</strong>
            <div id="theme-select-row">
                <span id="identity-label">Theme</span>
                <select id="theme-select">
                    <option value="default">Monochrome</option>
                    <option value="theme-glyph">Glyph White</option>
                    <option value="theme-phosphor">Phosphor Green</option>
                </select>
            </div>
            <button id="identity-edit" type="button">Change name</button>
            <button id="copy-invite" type="button">Copy invite link</button>
            <button id="export-chat" type="button">Export chat</button>
        </div>
    </div>

    <!-- Chat Message Container -->
    <ul id="messages"></ul>

    <!-- Typing Indicator -->
    <div id="typing-indicator">
        <span id="typing-text"></span>
        <span class="typing-dots"><i></i><i></i><i></i></span>
    </div>

    <!-- Input Form -->
    <form id="form">
        <button id="emoji-toggle" type="button" aria-label="Open emoji picker">😊</button>
        <div id="emoji-drawer"></div>
        <input id="input" autocomplete="off" placeholder="Type a message in any language..." />
        <button type="submit">Send</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- Theme switcher ---
        // Applied first, before the rest of the UI sets up, so there's no
        // flash of the default theme on reload.
        const THEME_CLASSES = ['theme-glyph', 'theme-phosphor'];
        function applyTheme(themeValue) {
            document.body.classList.remove(...THEME_CLASSES);
            if (themeValue && THEME_CLASSES.includes(themeValue)) {
                document.body.classList.add(themeValue);
            }
        }
        const savedTheme = localStorage.getItem('chatTheme') || 'default';
        applyTheme(savedTheme);

        const socket = io();
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');
        const langSelect = document.getElementById('lang-select');

        // --- Connection overlay + join flow ---
        const overlay = document.getElementById('connection-overlay');
        const connectBtn = document.getElementById('connect-btn');
        const btnText = connectBtn.querySelector('.btn-text');
        const joinInput = document.getElementById('join-input');
        const roomInput = document.getElementById('room-input');
        const identityName = document.getElementById('identity-name');
        const identityRoom = document.getElementById('identity-room');

        function getRoomFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return (params.get('room') || '').trim().toLowerCase().slice(0, 24);
        }

        let username = localStorage.getItem('chatUsername') || '';
        let room = getRoomFromUrl() || localStorage.getItem('chatRoom') || '';
        let hasJoined = false;
        if (username) joinInput.value = username;
        if (room) roomInput.value = room;

        // A permanent ID for this browser, separate from socket.id (which
        // changes every time the connection drops and reconnects).
        let clientId = localStorage.getItem('chatClientId');
        if (!clientId) {
            clientId = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`);
            localStorage.setItem('chatClientId', clientId);
        }

        function addSystemNote(text) {
            const note = document.createElement('li');
            note.className = 'system-note';
            note.textContent = text;
            messages.appendChild(note);
            window.scrollTo(0, document.body.scrollHeight);
        }

        // --- Full-dive connection animation ---
        const diveSequence = document.getElementById('dive-sequence');
        const diveRing = document.getElementById('dive-ring');
        const diveCanvas = document.getElementById('dive-canvas');
        const diveStatus = document.getElementById('dive-status');
        const connectContainerEl = overlay.querySelector('.connect-container');
        const roomCodeBoxEl = overlay.querySelector('.room-code-box');

        function resetDiveUI() {
            connectBtn.disabled = false;
            joinInput.disabled = false;
            roomInput.disabled = false;
            isDiving = false;
            connectContainerEl.classList.remove('diving-out');
            if (roomCodeBoxEl) roomCodeBoxEl.classList.remove('diving-out');
            diveSequence.classList.remove('active', 'fading');
            diveRing.classList.remove('handshake');
            diveCanvas.classList.remove('visible');
            diveStatus.classList.remove('visible');
            diveStatus.textContent = '';
        }

        function setDiveStatus(text) {
            diveStatus.textContent = text;
            diveStatus.classList.add('visible');
        }

        function playDiveSequence(onComplete) {
            const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            connectContainerEl.classList.add('diving-out');
            if (roomCodeBoxEl) roomCodeBoxEl.classList.add('diving-out');
            diveSequence.classList.add('active');

            // Reduced-motion path: a short fade-and-synchronize, no tunnel geometry at all.
            if (prefersReduced) {
                setDiveStatus('CONNECTING...');
                setTimeout(() => {
                    setDiveStatus('CONNECTION ESTABLISHED');
                    setTimeout(() => {
                        onComplete();
                        setTimeout(resetDiveUI, 900); // after the overlay's own fade-out transition
                    }, 500);
                }, 500);
                return;
            }

            // Phase 1 — Connection Initiated (0-0.4s): CSS-only handshake pulse,
            // before the WebGL scene spins up.
            setDiveStatus('INITIALIZING CONNECTION');
            diveRing.classList.add('handshake');

            setTimeout(() => {
                diveCanvas.classList.add('visible');
                runDiveTunnel(() => {
                    onComplete();
                    setTimeout(resetDiveUI, 900);
                });
            }, 400);
        }

        function runDiveTunnel(onFinished) {
            const canvas = diveCanvas;
            const width = window.innerWidth;
            const height = window.innerHeight;
            const isSmallScreen = width < 640;

            const PARTICLE_COUNT = isSmallScreen ? 500 : 1200;
            const RING_COUNT = isSmallScreen ? 4 : 7;
            const SYMBOL_COUNT = isSmallScreen ? 4 : 8;
            const TUNNEL_DEPTH = 60;
            const CAMERA_Z = 6;
            const STREAK_COUNT = Math.min(PARTICLE_COUNT, isSmallScreen ? 120 : 220);

            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030712, 0.045);

            const camera = new THREE.PerspectiveCamera(55, width / height, 0.1, 200);
            camera.position.z = CAMERA_Z;

            let renderer;
            try {
                renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
            } catch (err) {
                // No WebGL available — skip straight to the sync/materialize text and finish.
                setDiveStatus('SYNCHRONIZING');
                setTimeout(() => setDiveStatus('CONNECTION ESTABLISHED'), 400);
                setTimeout(onFinished, 1000);
                return;
            }
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.setSize(width, height);

            // --- Particle field (tunnel walls) ---
            const particlePositions = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 1.4 + Math.random() * 2.6;
                particlePositions[i * 3] = Math.cos(angle) * radius;
                particlePositions[i * 3 + 1] = Math.sin(angle) * radius;
                particlePositions[i * 3 + 2] = -Math.random() * TUNNEL_DEPTH;
            }
            const particleGeometry = new THREE.BufferGeometry();
            particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
            const particleMaterial = new THREE.PointsMaterial({
                color: 0x8fe9ff,
                size: 0.07,
                transparent: true,
                opacity: 0,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const particles = new THREE.Points(particleGeometry, particleMaterial);
            scene.add(particles);

            // --- Speed streaks (only visible once moving fast) ---
            const streakPositions = new Float32Array(STREAK_COUNT * 2 * 3);
            const streakGeometry = new THREE.BufferGeometry();
            streakGeometry.setAttribute('position', new THREE.BufferAttribute(streakPositions, 3));
            const streakMaterial = new THREE.LineBasicMaterial({
                color: 0xbdf3ff,
                transparent: true,
                opacity: 0,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const streaks = new THREE.LineSegments(streakGeometry, streakMaterial);
            scene.add(streaks);

            // --- Rings and arcs ---
            const rings = [];
            for (let i = 0; i < RING_COUNT; i++) {
                const isArc = i % 3 === 0;
                const radius = 1.2 + Math.random() * 2.2;
                const geometry = isArc
                    ? new THREE.RingGeometry(radius, radius + 0.03, 48, 1, 0, Math.PI * (0.3 + Math.random() * 0.5))
                    : new THREE.RingGeometry(radius, radius + 0.025, 64);
                const material = new THREE.MeshBasicMaterial({
                    color: i % 2 === 0 ? 0x8fe9ff : 0x5ea8ff,
                    transparent: true,
                    opacity: 0,
                    side: THREE.DoubleSide,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.z = -(i / RING_COUNT) * TUNNEL_DEPTH;
                mesh.rotation.z = Math.random() * Math.PI * 2;
                mesh.rotation.x = (Math.random() - 0.5) * 0.3;
                scene.add(mesh);
                rings.push({
                    mesh,
                    spin: (Math.random() > 0.5 ? 1 : -1) * (0.2 + Math.random() * 0.5),
                    baseOpacity: 0.35 + Math.random() * 0.35,
                    fadesEarly: i % 2 === 0 // half the rings fade out during Phase 4
                });
            }

            // --- Small geometric symbols ---
            const symbols = [];
            for (let i = 0; i < SYMBOL_COUNT; i++) {
                const geometry = new THREE.IcosahedronGeometry(0.15, 0);
                const material = new THREE.MeshBasicMaterial({
                    color: 0xbdf3ff,
                    wireframe: true,
                    transparent: true,
                    opacity: 0
                });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(
                    (Math.random() - 0.5) * 5,
                    (Math.random() - 0.5) * 5,
                    -Math.random() * TUNNEL_DEPTH
                );
                scene.add(mesh);
                symbols.push({
                    mesh,
                    spinX: (Math.random() - 0.5) * 0.03,
                    spinY: (Math.random() - 0.5) * 0.03
                });
            }

            // --- Faint grid planes (occasional light planes through the tunnel) ---
            const grid1 = new THREE.GridHelper(10, 12, 0x3d7fa8, 0x1f3f52);
            grid1.position.set(0, -2.5, -TUNNEL_DEPTH * 0.5);
            grid1.material.transparent = true;
            grid1.material.opacity = 0;
            scene.add(grid1);

            // --- Central point for Phase 6 materialization flash ---
            const flashGeometry = new THREE.SphereGeometry(0.05, 16, 16);
            const flashMaterial = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const flash = new THREE.Mesh(flashGeometry, flashMaterial);
            flash.position.z = CAMERA_Z - 3;
            scene.add(flash);

            function easeInQuad(t) { return t * t; }
            function easeOutQuad(t) { return 1 - (1 - t) * (1 - t); }
            function clamp01(v) { return Math.max(0, Math.min(1, v)); }
            function lerp(a, b, t) { return a + (b - a) * t; }

            // Schedule, in ms, relative to this function's own start (Phase 1's
            // 0.4s CSS handshake already happened before this runs).
            const T_FORMATION_END = 700;   // Phase 2
            const T_ACCEL_END = 1400;      // Phase 3
            const T_TUNNEL_END = 2100;     // Phase 4
            const T_SYNC_END = 2600;       // Phase 5
            const T_MATERIALIZE_END = 3100; // Phase 6

            let speed = 0.02;
            let syncTextShown = false;
            let establishedTextShown = false;
            let flashTriggered = false;
            let completeTriggered = false;

            const startTime = performance.now();
            let rafId = null;

            function handleResize() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
            }
            window.addEventListener('resize', handleResize);

            function cleanup() {
                cancelAnimationFrame(rafId);
                window.removeEventListener('resize', handleResize);
                [particleGeometry, streakGeometry, flashGeometry, grid1.geometry].forEach(g => g.dispose());
                [particleMaterial, streakMaterial, flashMaterial, grid1.material].forEach(m => m.dispose());
                rings.forEach(r => { r.mesh.geometry.dispose(); r.mesh.material.dispose(); });
                symbols.forEach(s => { s.mesh.geometry.dispose(); s.mesh.material.dispose(); });
                renderer.dispose();
                diveCanvas.classList.remove('visible');
                diveSequence.classList.remove('fading');
            }

            function tick(now) {
                const elapsed = now - startTime;

                if (elapsed < T_FORMATION_END) {
                    // Phase 2 — Digital Interface Formation
                    const p = elapsed / T_FORMATION_END;
                    speed = lerp(0.02, 0.06, p);
                    const fadeIn = clamp01(p * 1.4);
                    particleMaterial.opacity = fadeIn;
                    rings.forEach(r => { r.mesh.material.opacity = r.baseOpacity * fadeIn; });
                    symbols.forEach(s => { s.mesh.material.opacity = 0.5 * fadeIn; });
                    camera.fov = 55;
                } else if (elapsed < T_ACCEL_END) {
                    // Phase 3 — Acceleration
                    const p = easeInQuad((elapsed - T_FORMATION_END) / (T_ACCEL_END - T_FORMATION_END));
                    speed = lerp(0.06, 0.95, p);
                    camera.fov = lerp(55, 85, p);
                } else if (elapsed < T_TUNNEL_END) {
                    // Phase 4 — Data Tunnel
                    const p = (elapsed - T_ACCEL_END) / (T_TUNNEL_END - T_ACCEL_END);
                    speed = 0.85 + Math.sin(elapsed * 0.02) * 0.1;
                    camera.fov = 85;
                    // Gradually thin out half the rings and fade the grid in/out
                    rings.forEach(r => {
                        if (r.fadesEarly) r.mesh.material.opacity = r.baseOpacity * (1 - p);
                    });
                    grid1.material.opacity = Math.sin(p * Math.PI) * 0.18;
                } else if (elapsed < T_SYNC_END) {
                    // Phase 5 — System Synchronization
                    const p = easeOutQuad((elapsed - T_TUNNEL_END) / (T_SYNC_END - T_TUNNEL_END));
                    speed = lerp(0.9, 0, p);
                    camera.fov = lerp(85, 55, p);
                    grid1.material.opacity = lerp(grid1.material.opacity, 0, 0.2);
                    // Remaining rings converge: spin down and align flat
                    rings.forEach(r => {
                        if (!r.fadesEarly) {
                            r.mesh.rotation.z = lerp(r.mesh.rotation.z, 0, 0.08);
                            r.mesh.rotation.x = lerp(r.mesh.rotation.x, 0, 0.08);
                            r.mesh.material.opacity = lerp(r.mesh.material.opacity, r.baseOpacity * 0.6, 0.1);
                        } else {
                            r.mesh.material.opacity = lerp(r.mesh.material.opacity, 0, 0.15);
                        }
                    });
                    symbols.forEach(s => { s.mesh.material.opacity = lerp(s.mesh.material.opacity, 0, 0.1); });

                    if (!syncTextShown) {
                        syncTextShown = true;
                        setDiveStatus('SYNCHRONIZING');
                    }
                    if (!establishedTextShown && p > 0.55) {
                        establishedTextShown = true;
                        setDiveStatus('CONNECTION ESTABLISHED');
                    }
                } else if (elapsed < T_MATERIALIZE_END) {
                    // Phase 6 — Transition Into the Chat Environment
                    const p = (elapsed - T_SYNC_END) / (T_MATERIALIZE_END - T_SYNC_END);
                    speed = 0;
                    particleMaterial.opacity = lerp(particleMaterial.opacity, 0, 0.15);
                    rings.forEach(r => { r.mesh.material.opacity = lerp(r.mesh.material.opacity, 0, 0.15); });

                    flashMaterial.opacity = p < 0.6 ? lerp(0, 0.9, p / 0.6) : lerp(0.9, 0, (p - 0.6) / 0.4);
                    const flashScale = lerp(0.05, 45, easeInQuad(p));
                    flash.scale.setScalar(flashScale);

                    if (!flashTriggered && p > 0.35) {
                        flashTriggered = true;
                        diveSequence.classList.add('fading');
                        diveStatus.classList.remove('visible');
                    }
                    if (!completeTriggered && p > 0.5) {
                        completeTriggered = true;
                        onFinished();
                    }
                } else {
                    cleanup();
                    return;
                }

                // Advance tunnel content toward the camera and wrap anything
                // that passes it back to the far end, so the tunnel reads as
                // effectively infinite without ever allocating new geometry.
                const posAttr = particleGeometry.attributes.position;
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    let z = posAttr.getZ(i) + speed;
                    if (z > CAMERA_Z - 1) z -= TUNNEL_DEPTH;
                    posAttr.setZ(i, z);
                }
                posAttr.needsUpdate = true;

                const speedNormalized = clamp01(speed / 1.0);
                const streakLen = 1 + speedNormalized * 4;
                const streakAttr = streakGeometry.attributes.position;
                for (let i = 0; i < STREAK_COUNT; i++) {
                    const px = posAttr.getX(i), py = posAttr.getY(i), pz = posAttr.getZ(i);
                    streakAttr.setXYZ(i * 2, px, py, pz);
                    streakAttr.setXYZ(i * 2 + 1, px, py, pz - streakLen);
                }
                streakAttr.needsUpdate = true;
                if (elapsed < T_SYNC_END) {
                    streakMaterial.opacity = speedNormalized * 0.5;
                }

                rings.forEach(r => {
                    let z = r.mesh.position.z + speed;
                    if (z > CAMERA_Z - 1) z -= TUNNEL_DEPTH;
                    r.mesh.position.z = z;
                    r.mesh.rotation.z += r.spin * 0.02;
                });

                symbols.forEach(s => {
                    let z = s.mesh.position.z + speed;
                    if (z > CAMERA_Z - 1) z -= TUNNEL_DEPTH;
                    s.mesh.position.z = z;
                    s.mesh.rotation.x += s.spinX;
                    s.mesh.rotation.y += s.spinY;
                });

                let gridZ = grid1.position.z + speed;
                if (gridZ > CAMERA_Z - 1) gridZ -= TUNNEL_DEPTH;
                grid1.position.z = gridZ;

                renderer.render(scene, camera);
                rafId = requestAnimationFrame(tick);
            }

            rafId = requestAnimationFrame(tick);
        }

        let hasSeenIntro = false;
        let isDiving = false;

        function enterChat(name, roomCode) {
            if (isDiving) return; // ignore duplicate Initialize Connection clicks
            isDiving = true;
            connectBtn.disabled = true;
            joinInput.disabled = true;
            roomInput.disabled = true;

            username = (name || '').trim().slice(0, 24) || 'Anonymous';
            room = (roomCode || '').trim().toLowerCase().slice(0, 24) || 'lobby';
            localStorage.setItem('chatUsername', username);
            localStorage.setItem('chatRoom', room);
            identityName.textContent = username;
            identityRoom.textContent = room;

            // Reflect the room in the URL so refreshing or sharing the link keeps everyone together
            const url = new URL(window.location);
            url.searchParams.set('room', room);
            window.history.replaceState({}, '', url);

            // Fire the real handshake immediately in the background — the dive
            // animation's length is cosmetic and shouldn't wait on network speed,
            // nor should a slow connection cut the animation short.
            hasJoined = true;
            socket.emit('join', { username, clientId, room });

            if (!hasSeenIntro) {
                hasSeenIntro = true;
                addSystemNote('Welcome to Global Chat. Messages are translated automatically into your selected language — pick one up top. Tag @companion anywhere in a message to talk to the AI assistant.');
            }

            playDiveSequence(() => {
                overlay.classList.add('fade-out');
                input.focus();
            });
        }

        connectBtn.addEventListener('click', () => enterChat(joinInput.value, roomInput.value));
        joinInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') enterChat(joinInput.value, roomInput.value);
        });
        roomInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') enterChat(joinInput.value, roomInput.value);
        });

        // Re-announce identity only if we reconnect after already having joined
        // (e.g. the server restarted) — never on the initial silent connection.
        socket.on('connect', () => {
            if (hasJoined) socket.emit('join', { username, clientId, room });
        });

        // --- Identity menu (•••) ---
        const identityToggle = document.getElementById('identity-toggle');
        const identityPanel = document.getElementById('identity-panel');
        const identityEdit = document.getElementById('identity-edit');
        const copyInviteBtn = document.getElementById('copy-invite');

        identityToggle.addEventListener('click', () => {
            identityPanel.classList.toggle('open');
        });
        identityEdit.addEventListener('click', () => {
            identityPanel.classList.remove('open');
            joinInput.value = username;
            roomInput.value = room;
            btnText.innerText = "INITIALIZE CONNECTION";
            resetDiveUI();
            overlay.classList.remove('fade-out');
        });
        copyInviteBtn.addEventListener('click', async () => {
            const originalLabel = copyInviteBtn.textContent;
            try {
                await navigator.clipboard.writeText(window.location.href);
                copyInviteBtn.textContent = 'Copied!';
            } catch (err) {
                copyInviteBtn.textContent = 'Copy failed';
            }
            setTimeout(() => { copyInviteBtn.textContent = originalLabel; }, 1500);
        });

        const exportChatBtn = document.getElementById('export-chat');
        exportChatBtn.addEventListener('click', () => {
            window.open(`/api/export?room=${encodeURIComponent(room)}`, '_blank');
        });

        const themeSelect = document.getElementById('theme-select');
        themeSelect.value = savedTheme;
        themeSelect.addEventListener('change', () => {
            const value = themeSelect.value;
            applyTheme(value);
            localStorage.setItem('chatTheme', value);
        });

        // Automatically fetch all 130+ languages and build the dropdown
        fetch('/api/languages')
            .then(res => res.json())
            .then(langs => {
                langSelect.innerHTML = '';
                langs.forEach(lang => {
                    const option = document.createElement('option');
                    option.value = lang.code;
                    option.textContent = lang.name;
                    if (lang.code === 'en') option.selected = true; // Set default language
                    langSelect.appendChild(option);
                });
            });

        // Form submission: sends message in whatever language the user types
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value.trim()) {
                socket.emit('chat message', input.value.trim());
                input.value = '';
                socket.emit('stop typing');
            }
        });

        // --- Emoji picker (input drawer) ---
        const emojiToggle = document.getElementById('emoji-toggle');
        const emojiDrawer = document.getElementById('emoji-drawer');
        const EMOJI_PICKER_SET = [
            '😀', '😂', '😊', '😍', '🤔', '😎', '😢', '😡',
            '👍', '👎', '🙏', '👏', '🔥', '🎉', '💯', '✨',
            '❤️', '💀', '😱', '🤝', '👀', '🙌', '😴', '🤯'
        ];

        EMOJI_PICKER_SET.forEach((emoji) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = emoji;
            btn.addEventListener('click', () => {
                insertAtCursor(input, emoji);
                input.focus();
            });
            emojiDrawer.appendChild(btn);
        });

        function insertAtCursor(inputEl, text) {
            const start = inputEl.selectionStart ?? inputEl.value.length;
            const end = inputEl.selectionEnd ?? inputEl.value.length;
            inputEl.value = inputEl.value.slice(0, start) + text + inputEl.value.slice(end);
            const cursorPos = start + text.length;
            inputEl.setSelectionRange(cursorPos, cursorPos);
        }

        emojiToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            emojiDrawer.classList.toggle('open');
        });

        document.addEventListener('click', (e) => {
            if (!emojiDrawer.classList.contains('open')) return;
            if (emojiDrawer.contains(e.target) || e.target === emojiToggle) return;
            emojiDrawer.classList.remove('open');
        });

        // --- Typing indicator (outgoing) ---
        let typingTimeout = null;
        input.addEventListener('input', () => {
            socket.emit('typing');
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => socket.emit('stop typing'), 1500);
        });

        // --- Typing indicator (incoming) ---
        const typingIndicator = document.getElementById('typing-indicator');
        const typingText = document.getElementById('typing-text');
        const typingUsers = new Map(); // senderId -> username

        function renderTypingState() {
            const names = [...typingUsers.values()];
            if (names.length === 0) {
                typingIndicator.classList.remove('visible');
                return;
            }
            const label = names.length === 1
                ? `${names[0]} is typing`
                : `${names.slice(0, 2).join(', ')}${names.length > 2 ? ' and others' : ''} are typing`;
            typingText.textContent = label;
            typingIndicator.classList.add('visible');
        }

        socket.on('typing', (data) => {
            typingUsers.set(data.senderId, data.username || 'Someone');
            renderTypingState();
        });
        socket.on('stop typing', (data) => {
            typingUsers.delete(data.senderId);
            renderTypingState();
        });

        function formatTime(ts) {
            const d = new Date(ts || Date.now());
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // Plain user/system text: escape it so nobody can inject HTML into
        // the page by typing it as a "username" or message.
        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // --- Interactive polls ---
        function renderPollOptions(container, pollId, options, closed) {
            const totalVotes = options.reduce((sum, o) => sum + o.votes, 0);
            container.innerHTML = options.map((opt, i) => {
                const pct = totalVotes > 0 ? Math.round((opt.votes / totalVotes) * 100) : 0;
                return `
                    <button class="poll-option" data-index="${i}" ${closed ? 'disabled' : ''} style="background: linear-gradient(to right, rgba(204,0,0,0.25) ${pct}%, transparent ${pct}%)">
                        <span class="poll-option-text">${escapeHtml(opt.text)}</span>
                        <span class="poll-option-votes">${opt.votes}</span>
                    </button>
                `;
            }).join('');

            if (!closed) {
                container.querySelectorAll('.poll-option').forEach((btn) => {
                    btn.addEventListener('click', () => {
                        socket.emit('poll vote', { pollId, optionIndex: parseInt(btn.dataset.index, 10) });
                    });
                });
            }
        }

        socket.on('poll created', (data) => {
            const item = document.createElement('li');
            item.className = 'poll';
            item.dataset.pollId = data.pollId;
            item.innerHTML = `
                <div class="meta"><span class="name">Poll</span><span class="time">${formatTime(data.timestamp)}</span></div>
                <div class="poll-question">${escapeHtml(data.question)}</div>
                <div class="poll-options"></div>
                <div class="poll-status">Voting open — click an option to vote</div>
            `;
            messages.appendChild(item);
            renderPollOptions(item.querySelector('.poll-options'), data.pollId, data.options, false);
            window.scrollTo(0, document.body.scrollHeight);
        });

        socket.on('poll update', (data) => {
            const item = messages.querySelector(`li.poll[data-poll-id="${data.pollId}"]`);
            if (!item) return;
            renderPollOptions(item.querySelector('.poll-options'), data.pollId, data.options, false);
        });

        socket.on('poll closed', (data) => {
            const item = messages.querySelector(`li.poll[data-poll-id="${data.pollId}"]`);
            if (!item) return;
            renderPollOptions(item.querySelector('.poll-options'), data.pollId, data.options, true);
            const statusEl = item.querySelector('.poll-status');
            if (statusEl) statusEl.textContent = 'Poll closed — final results';
        });

        // --- Self-destruct rooms (/burn) ---
        const burnBanner = document.getElementById('burn-banner');
        const burnBannerText = document.getElementById('burn-banner-text');
        const burnOverlay = document.getElementById('burn-overlay');
        const burnReloadBtn = document.getElementById('burn-reload-btn');
        let burnInterval = null;

        function startBurnCountdown(fireAt) {
            stopBurnCountdown();
            burnBanner.classList.add('visible');

            function tick() {
                const remaining = Math.max(0, fireAt - Date.now());
                if (remaining <= 0) {
                    burnBannerText.textContent = 'PURGING...';
                    return;
                }
                const totalSeconds = Math.ceil(remaining / 1000);
                const h = Math.floor(totalSeconds / 3600);
                const m = Math.floor((totalSeconds % 3600) / 60);
                const s = totalSeconds % 60;
                const parts = [];
                if (h) parts.push(`${h}h`);
                if (h || m) parts.push(`${m}m`);
                parts.push(`${s}s`);
                burnBannerText.textContent = `SELF-DESTRUCT IN ${parts.join(' ')}`;
            }

            tick();
            burnInterval = setInterval(tick, 1000);
        }

        function stopBurnCountdown() {
            if (burnInterval) clearInterval(burnInterval);
            burnInterval = null;
            burnBanner.classList.remove('visible');
        }

        socket.on('burn scheduled', (data) => startBurnCountdown(data.fireAt));
        socket.on('burn cancelled', () => stopBurnCountdown());
        socket.on('room burned', () => {
            stopBurnCountdown();
            burnOverlay.classList.add('visible');
        });

        burnReloadBtn.addEventListener('click', () => {
            window.location.reload();
        });

        // Companion replies: render Markdown (bold, lists, code, etc.) as
        // real formatting, then sanitize the result so nothing unsafe slips
        // through even though it's coming from a trusted source.
        function renderAiText(str) {
            const html = marked.parse(str ?? '');
            return DOMPurify.sanitize(html);
        }

        // --- In-chat code sandbox ---
        const sandboxOverlay = document.getElementById('sandbox-overlay');
        const sandboxFrame = document.getElementById('sandbox-frame');
        const sandboxClose = document.getElementById('sandbox-close');
        const sandboxReset = document.getElementById('sandbox-reset');
        let currentSandboxDoc = '';

        function openSandbox(code, lang) {
            // Plain JS gets wrapped in a minimal HTML shell so it has
            // somewhere to run; HTML snippets run as-is.
            const doc = lang === 'html'
                ? code
                : `<!DOCTYPE html><html><head><style>body{font-family:sans-serif;background:#fff;color:#111;padding:1rem}</style></head><body><script>${code}<\/script></body></html>`;

            currentSandboxDoc = doc;

            // sandbox="allow-scripts" only (no allow-same-origin) gives the
            // iframe an opaque, isolated origin — the snippet can run JS but
            // can't read cookies, localStorage, or reach anything on the
            // real page.
            sandboxFrame.srcdoc = doc;
            sandboxOverlay.classList.add('visible');
        }

        function closeSandbox() {
            sandboxOverlay.classList.remove('visible');
            sandboxFrame.srcdoc = '';
            currentSandboxDoc = '';
        }

        function resetSandbox() {
            if (!currentSandboxDoc) return;
            // Clearing then re-setting srcdoc forces a full iframe reload,
            // which kills any runaway loop, interval, or animation from the
            // previous run — a fresh sandboxed document, same content.
            sandboxFrame.srcdoc = '';
            requestAnimationFrame(() => {
                sandboxFrame.srcdoc = currentSandboxDoc;
            });
        }

        sandboxClose.addEventListener('click', closeSandbox);
        sandboxReset.addEventListener('click', resetSandbox);
        sandboxOverlay.addEventListener('click', (e) => {
            if (e.target === sandboxOverlay) closeSandbox();
        });

        // Scans a rendered AI reply for HTML/JS code blocks and attaches a
        // "▶ RUN" button under each one. Only html/js/javascript blocks
        // qualify — other languages (python, css alone, etc.) have nothing
        // a browser sandbox can meaningfully execute.
        function enhanceCodeBlocks(containerEl) {
            const blocks = containerEl.querySelectorAll('pre > code');
            blocks.forEach((codeEl) => {
                const langMatch = [...codeEl.classList].find(c => c.startsWith('language-'));
                const lang = langMatch ? langMatch.replace('language-', '').toLowerCase() : '';
                if (lang !== 'html' && lang !== 'js' && lang !== 'javascript') return;

                const preEl = codeEl.closest('pre');
                if (!preEl || preEl.dataset.sandboxed === 'true') return;
                preEl.dataset.sandboxed = 'true';

                const runBtn = document.createElement('button');
                runBtn.type = 'button';
                runBtn.className = 'run-btn';
                runBtn.textContent = '▶ RUN';
                runBtn.addEventListener('click', () => {
                    openSandbox(codeEl.textContent, lang === 'html' ? 'html' : 'js');
                });
                preEl.insertAdjacentElement('afterend', runBtn);
            });
        }

        // Strip Markdown syntax down to plain readable text, for TTS —
        // hearing "asterisk asterisk bold asterisk asterisk" out loud would
        // defeat the point.
        function stripMarkdownForSpeech(str) {
            return String(str ?? '')
                .replace(/```[\s\S]*?```/g, ' code block omitted ')
                .replace(/`([^`]+)`/g, '$1')
                .replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1')
                .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
                .replace(/[*_#>~]/g, '')
                .replace(/^\s*-\s+/gm, '')
                .replace(/\n{2,}/g, '. ')
                .replace(/\n/g, ' ')
                .trim();
        }

        // --- Voice output (manual play button per companion reply) ---
        let currentUtterance = null;

        function speakText(text, btnEl) {
            if (!('speechSynthesis' in window)) return;

            // If this exact button is already speaking, stop it (toggle off)
            if (currentUtterance && btnEl.dataset.speaking === 'true') {
                window.speechSynthesis.cancel();
                return;
            }

            // Cancel any other reply currently being read
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(stripMarkdownForSpeech(text));
            currentUtterance = utterance;

            document.querySelectorAll('.speak-btn[data-speaking="true"]').forEach(el => {
                el.dataset.speaking = 'false';
                el.textContent = '🔊';
            });

            btnEl.dataset.speaking = 'true';
            btnEl.textContent = '⏹';

            utterance.onend = utterance.onerror = () => {
                btnEl.dataset.speaking = 'false';
                btnEl.textContent = '🔊';
                if (currentUtterance === utterance) currentUtterance = null;
            };

            window.speechSynthesis.speak(utterance);
        }

        function addSpeakButton(item, bodyEl, getText) {
            if (!('speechSynthesis' in window)) return;
            const metaEl = item.querySelector('.meta');
            if (!metaEl || metaEl.querySelector('.speak-btn')) return;

            const timeEl = metaEl.querySelector('.time');
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'speak-btn';
            btn.textContent = '🔊';
            btn.dataset.speaking = 'false';
            btn.addEventListener('click', () => speakText(getText(), btn));

            // Put the button right after the timestamp so both sit together
            // on the right side of the row, instead of getting spread apart
            // by the row's space-between layout.
            if (timeEl) {
                timeEl.insertAdjacentElement('afterend', btn);
            } else {
                metaEl.appendChild(btn);
            }
        }

        // --- Click-to-react ---
        // Must mirror the server's ALLOWED_REACTIONS list — sending anything
        // outside it is simply ignored server-side.
        const QUICK_REACTIONS = ['👍', '❤️', '😂', '😮', '😢', '🔥', '🎉', '👀'];

        function attachReactionUI(item, messageId) {
            if (!messageId) return;
            item.dataset.messageId = messageId;

            const toggle = document.createElement('button');
            toggle.type = 'button';
            toggle.className = 'react-toggle';
            toggle.textContent = '☺+';
            toggle.setAttribute('aria-label', 'Add reaction');

            const popover = document.createElement('div');
            popover.className = 'react-popover';
            QUICK_REACTIONS.forEach((emoji) => {
                const emojiBtn = document.createElement('button');
                emojiBtn.type = 'button';
                emojiBtn.textContent = emoji;
                emojiBtn.addEventListener('click', () => {
                    socket.emit('react', { messageId, emoji, room });
                    popover.classList.remove('open');
                    toggle.classList.remove('open');
                });
                popover.appendChild(emojiBtn);
            });

            toggle.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = popover.classList.toggle('open');
                toggle.classList.toggle('open', isOpen);
            });

            const reactionsEl = document.createElement('div');
            reactionsEl.className = 'reactions';

            item.appendChild(toggle);
            item.appendChild(popover);
            item.appendChild(reactionsEl);
        }

        // Close any open reaction popover when clicking elsewhere on the page
        document.addEventListener('click', (e) => {
            document.querySelectorAll('.react-popover.open').forEach((pop) => {
                if (pop.contains(e.target)) return;
                pop.classList.remove('open');
                const toggle = pop.previousElementSibling;
                if (toggle && toggle.classList.contains('react-toggle')) toggle.classList.remove('open');
            });
        });

        function renderReactions(messageId, reactions) {
            const item = messages.querySelector(`li[data-message-id="${CSS.escape(messageId)}"]`);
            if (!item) return;
            const container = item.querySelector('.reactions');
            if (!container) return;

            container.innerHTML = '';
            reactions.forEach(({ emoji, count, voters }) => {
                const pill = document.createElement('button');
                pill.type = 'button';
                pill.className = 'reaction-pill' + ((voters || []).includes(clientId) ? ' mine' : '');
                pill.innerHTML = `<span>${emoji}</span><span class="count">${count}</span>`;
                pill.addEventListener('click', () => {
                    socket.emit('react', { messageId, emoji, room });
                });
                container.appendChild(pill);
            });
        }

        socket.on('reaction update', (data) => {
            renderReactions(data.messageId, data.reactions);
        });

        // --- Streaming companion replies ---
        const streamingMessages = new Map(); // replyId -> { bodyEl, rawText }

        socket.on('companion message start', (data) => {
            const item = document.createElement('li');
            item.className = 'ai';
            item.innerHTML = `
                <div class="meta"><span class="name">${escapeHtml(data.username || 'Companion')}</span><span class="time">${formatTime(data.timestamp)}</span></div>
                <div class="persona-tag">${escapeHtml(data.persona || 'Default')} MODE</div>
                <div class="body"></div>
            `;
            attachReactionUI(item, data.replyId);
            messages.appendChild(item);
            window.scrollTo(0, document.body.scrollHeight);

            streamingMessages.set(data.replyId, {
                bodyEl: item.querySelector('.body'),
                rawText: ''
            });
        });

        socket.on('companion message chunk', (data) => {
            const entry = streamingMessages.get(data.replyId);
            if (!entry) return;
            entry.rawText += data.delta;
            entry.bodyEl.textContent = entry.rawText; // plain text while streaming
            window.scrollTo(0, document.body.scrollHeight);
        });

        socket.on('companion message end', async (data) => {
            const entry = streamingMessages.get(data.replyId);
            streamingMessages.delete(data.replyId);
            if (!entry) return;

            const { bodyEl } = entry;
            const finalText = data.text ?? entry.rawText;
            const item = bodyEl.closest('li');

            if (data.error) {
                bodyEl.textContent = finalText;
                window.scrollTo(0, document.body.scrollHeight);
                return;
            }

            bodyEl.innerHTML = renderAiText(finalText);
            window.scrollTo(0, document.body.scrollHeight);
            if (item) addSpeakButton(item, bodyEl, () => finalText);
            enhanceCodeBlocks(bodyEl);

            // Same translate step the regular message flow does, just applied
            // after the fact instead of blocking the initial render.
            const targetLang = langSelect.value;
            try {
                const response = await fetch(`/api/translate?text=${encodeURIComponent(finalText)}&target=${targetLang}`);
                const result = await response.json();
                if (result.translatedText) {
                    bodyEl.innerHTML = `
                        <strong>Original (${escapeHtml(result.fromLang)}):</strong> ${renderAiText(finalText)}<br>
                        <strong>Translated (${escapeHtml(targetLang)}):</strong> ${renderAiText(result.translatedText)}
                    `;
                    window.scrollTo(0, document.body.scrollHeight);
                    enhanceCodeBlocks(bodyEl);
                }
            } catch (err) {
                // Keep showing the untranslated rendered reply — no need to surface this
            }
        });

        // Receive incoming messages and translate according to user's selected language
        socket.on('chat message', async (data) => {
            const targetLang = langSelect.value;
            const isOwn = data.clientId === clientId;
            const isSystem = data.senderId === 'SYSTEM';

            if (data.senderId) {
                typingUsers.delete(data.senderId);
                renderTypingState();
            }

            if (isSystem) {
                addSystemNote(data.text);
                return;
            }

            const item = document.createElement('li');
            item.className = isOwn ? 'own' : 'other';

            // Own messages: skip translation, show as-is
            if (isOwn) {
                item.innerHTML = `
                    <div class="meta"><span class="name">${escapeHtml(data.username || 'You')}</span><span class="time">${formatTime(data.timestamp)}</span></div>
                    <div class="body">${escapeHtml(data.text)}</div>
                `;
                attachReactionUI(item, data.id);
                messages.appendChild(item);
                window.scrollTo(0, document.body.scrollHeight);
                return;
            }

            item.innerHTML = `
                <div class="meta"><span class="name">${escapeHtml(data.username || 'Stranger')}</span><span class="time">${formatTime(data.timestamp)}</span></div>
                <div class="body"><strong>Original:</strong> ${escapeHtml(data.text)}<br><em>Translating...</em></div>
            `;
            attachReactionUI(item, data.id);
            messages.appendChild(item);
            window.scrollTo(0, document.body.scrollHeight);

            const bodyEl = item.querySelector('.body');

            try {
                const response = await fetch(`/api/translate?text=${encodeURIComponent(data.text)}&target=${targetLang}`);
                const result = await response.json();

                if (result.translatedText) {
                    bodyEl.innerHTML = `
                        <strong>Original (${escapeHtml(result.fromLang)}):</strong> ${escapeHtml(data.text)}<br>
                        <strong>Translated (${escapeHtml(targetLang)}):</strong> ${escapeHtml(result.translatedText)}
                    `;
                } else {
                    bodyEl.innerHTML = escapeHtml(data.text);
                }
            } catch (err) {
                bodyEl.innerHTML = escapeHtml(data.text);
            }

            window.scrollTo(0, document.body.scrollHeight);
        });
    </script>
</body>
</html>
