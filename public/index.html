<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Connection / Join Overlay -->
    <div id="connection-overlay" class="overlay">
        <div class="connect-container">
            <h1 class="system-title">SYSTEM_LINK</h1>
            <input id="join-input" class="name-input" autocomplete="off" maxlength="24" placeholder="ENTER CALLSIGN" />
            <button id="connect-btn" class="connect-btn">
                <span class="btn-text">INITIALIZE CONNECTION</span>
                <div class="pulse-ring"></div>
            </button>
        </div>
        <div class="room-code-box">
            <label for="room-input">ROOM</label>
            <input id="room-input" autocomplete="off" maxlength="24" placeholder="lobby" />
        </div>
    </div>

    <!-- Language Selection Header -->
    <div id="top-bar">
        <label for="lang-select">Translate incoming messages to:</label>
        <select id="lang-select">
            <option value="en">Loading languages...</option>
        </select>
    </div>

    <!-- Identity Control -->
    <div id="identity-menu">
        <button id="identity-toggle" type="button">•••</button>
        <div id="identity-panel">
            <span id="identity-label">Signed in as</span>
            <strong id="identity-name">—</strong>
            <span id="identity-label">Room</span>
            <strong id="identity-room">—</strong>
            <button id="identity-edit" type="button">Change name</button>
            <button id="copy-invite" type="button">Copy invite link</button>
            <button id="export-chat" type="button">Export chat</button>
        </div>
    </div>

    <!-- Chat Message Container -->
    <ul id="messages"></ul>

    <!-- Typing Indicator -->
    <div id="typing-indicator">
        <span id="typing-text"></span>
        <span class="typing-dots"><i></i><i></i><i></i></span>
    </div>

    <!-- Input Form -->
    <form id="form">
        <input id="input" autocomplete="off" placeholder="Type a message in any language..." />
        <button type="submit">Send</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <script>
        const socket = io();
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');
        const langSelect = document.getElementById('lang-select');

        // --- Connection overlay + join flow ---
        const overlay = document.getElementById('connection-overlay');
        const connectBtn = document.getElementById('connect-btn');
        const btnText = connectBtn.querySelector('.btn-text');
        const joinInput = document.getElementById('join-input');
        const roomInput = document.getElementById('room-input');
        const identityName = document.getElementById('identity-name');
        const identityRoom = document.getElementById('identity-room');

        function getRoomFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return (params.get('room') || '').trim().toLowerCase().slice(0, 24);
        }

        let username = localStorage.getItem('chatUsername') || '';
        let room = getRoomFromUrl() || localStorage.getItem('chatRoom') || '';
        let hasJoined = false;
        if (username) joinInput.value = username;
        if (room) roomInput.value = room;

        // A permanent ID for this browser, separate from socket.id (which
        // changes every time the connection drops and reconnects).
        let clientId = localStorage.getItem('chatClientId');
        if (!clientId) {
            clientId = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`);
            localStorage.setItem('chatClientId', clientId);
        }

        function addSystemNote(text) {
            const note = document.createElement('li');
            note.className = 'system-note';
            note.textContent = text;
            messages.appendChild(note);
            window.scrollTo(0, document.body.scrollHeight);
        }

        let hasSeenIntro = false;

        function enterChat(name, roomCode) {
            username = (name || '').trim().slice(0, 24) || 'Anonymous';
            room = (roomCode || '').trim().toLowerCase().slice(0, 24) || 'lobby';
            localStorage.setItem('chatUsername', username);
            localStorage.setItem('chatRoom', room);
            identityName.textContent = username;
            identityRoom.textContent = room;

            // Reflect the room in the URL so refreshing or sharing the link keeps everyone together
            const url = new URL(window.location);
            url.searchParams.set('room', room);
            window.history.replaceState({}, '', url);

            hasJoined = true;
            socket.emit('join', { username, clientId, room });

            if (!hasSeenIntro) {
                hasSeenIntro = true;
                addSystemNote('Welcome to Global Chat. Messages are translated automatically into your selected language — pick one up top. Tag @companion anywhere in a message to talk to the AI assistant.');
            }

            btnText.innerText = "CONNECTING...";
            setTimeout(() => {
                overlay.classList.add('fade-out');
                input.focus();
            }, 600);
        }

        connectBtn.addEventListener('click', () => enterChat(joinInput.value, roomInput.value));
        joinInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') enterChat(joinInput.value, roomInput.value);
        });
        roomInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') enterChat(joinInput.value, roomInput.value);
        });

        // Re-announce identity only if we reconnect after already having joined
        // (e.g. the server restarted) — never on the initial silent connection.
        socket.on('connect', () => {
            if (hasJoined) socket.emit('join', { username, clientId, room });
        });

        // --- Identity menu (•••) ---
        const identityToggle = document.getElementById('identity-toggle');
        const identityPanel = document.getElementById('identity-panel');
        const identityEdit = document.getElementById('identity-edit');
        const copyInviteBtn = document.getElementById('copy-invite');

        identityToggle.addEventListener('click', () => {
            identityPanel.classList.toggle('open');
        });
        identityEdit.addEventListener('click', () => {
            identityPanel.classList.remove('open');
            joinInput.value = username;
            roomInput.value = room;
            btnText.innerText = "INITIALIZE CONNECTION";
            overlay.classList.remove('fade-out');
        });
        copyInviteBtn.addEventListener('click', async () => {
            const originalLabel = copyInviteBtn.textContent;
            try {
                await navigator.clipboard.writeText(window.location.href);
                copyInviteBtn.textContent = 'Copied!';
            } catch (err) {
                copyInviteBtn.textContent = 'Copy failed';
            }
            setTimeout(() => { copyInviteBtn.textContent = originalLabel; }, 1500);
        });

        const exportChatBtn = document.getElementById('export-chat');
        exportChatBtn.addEventListener('click', () => {
            window.open(`/api/export?room=${encodeURIComponent(room)}`, '_blank');
        });

        // Automatically fetch all 130+ languages and build the dropdown
        fetch('/api/languages')
            .then(res => res.json())
            .then(langs => {
                langSelect.innerHTML = '';
                langs.forEach(lang => {
                    const option = document.createElement('option');
                    option.value = lang.code;
                    option.textContent = lang.name;
                    if (lang.code === 'en') option.selected = true; // Set default language
                    langSelect.appendChild(option);
                });
            });

        // Form submission: sends message in whatever language the user types
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value.trim()) {
                socket.emit('chat message', input.value.trim());
                input.value = '';
                socket.emit('stop typing');
            }
        });

        // --- Typing indicator (outgoing) ---
        let typingTimeout = null;
        input.addEventListener('input', () => {
            socket.emit('typing');
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => socket.emit('stop typing'), 1500);
        });

        // --- Typing indicator (incoming) ---
        const typingIndicator = document.getElementById('typing-indicator');
        const typingText = document.getElementById('typing-text');
        const typingUsers = new Map(); // senderId -> username

        function renderTypingState() {
            const names = [...typingUsers.values()];
            if (names.length === 0) {
                typingIndicator.classList.remove('visible');
                return;
            }
            const label = names.length === 1
                ? `${names[0]} is typing`
                : `${names.slice(0, 2).join(', ')}${names.length > 2 ? ' and others' : ''} are typing`;
            typingText.textContent = label;
            typingIndicator.classList.add('visible');
        }

        socket.on('typing', (data) => {
            typingUsers.set(data.senderId, data.username || 'Someone');
            renderTypingState();
        });
        socket.on('stop typing', (data) => {
            typingUsers.delete(data.senderId);
            renderTypingState();
        });

        function formatTime(ts) {
            const d = new Date(ts || Date.now());
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // Plain user/system text: escape it so nobody can inject HTML into
        // the page by typing it as a "username" or message.
        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Companion replies: render Markdown (bold, lists, code, etc.) as
        // real formatting, then sanitize the result so nothing unsafe slips
        // through even though it's coming from a trusted source.
        function renderAiText(str) {
            const html = marked.parse(str ?? '');
            return DOMPurify.sanitize(html);
        }

        // Strip Markdown syntax down to plain readable text, for TTS —
        // hearing "asterisk asterisk bold asterisk asterisk" out loud would
        // defeat the point.
        function stripMarkdownForSpeech(str) {
            return String(str ?? '')
                .replace(/```[\s\S]*?```/g, ' code block omitted ')
                .replace(/`([^`]+)`/g, '$1')
                .replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1')
                .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
                .replace(/[*_#>~]/g, '')
                .replace(/^\s*-\s+/gm, '')
                .replace(/\n{2,}/g, '. ')
                .replace(/\n/g, ' ')
                .trim();
        }

        // --- Voice output (manual play button per companion reply) ---
        let currentUtterance = null;

        function speakText(text, btnEl) {
            if (!('speechSynthesis' in window)) return;

            // If this exact button is already speaking, stop it (toggle off)
            if (currentUtterance && btnEl.dataset.speaking === 'true') {
                window.speechSynthesis.cancel();
                return;
            }

            // Cancel any other reply currently being read
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(stripMarkdownForSpeech(text));
            currentUtterance = utterance;

            document.querySelectorAll('.speak-btn[data-speaking="true"]').forEach(el => {
                el.dataset.speaking = 'false';
                el.textContent = '🔊';
            });

            btnEl.dataset.speaking = 'true';
            btnEl.textContent = '⏹';

            utterance.onend = utterance.onerror = () => {
                btnEl.dataset.speaking = 'false';
                btnEl.textContent = '🔊';
                if (currentUtterance === utterance) currentUtterance = null;
            };

            window.speechSynthesis.speak(utterance);
        }

        function addSpeakButton(item, bodyEl, getText) {
            if (!('speechSynthesis' in window)) return;
            const metaEl = item.querySelector('.meta');
            if (!metaEl || metaEl.querySelector('.speak-btn')) return;

            const timeEl = metaEl.querySelector('.time');
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'speak-btn';
            btn.textContent = '🔊';
            btn.dataset.speaking = 'false';
            btn.addEventListener('click', () => speakText(getText(), btn));

            // Put the button right after the timestamp so both sit together
            // on the right side of the row, instead of getting spread apart
            // by the row's space-between layout.
            if (timeEl) {
                timeEl.insertAdjacentElement('afterend', btn);
            } else {
                metaEl.appendChild(btn);
            }
        }

        // --- Streaming companion replies ---
        const streamingMessages = new Map(); // replyId -> { bodyEl, rawText }

        socket.on('companion message start', (data) => {
            const item = document.createElement('li');
            item.className = 'ai';
            item.innerHTML = `
                <div class="meta"><span class="name">${escapeHtml(data.username || 'Companion')}</span><span class="time">${formatTime(data.timestamp)}</span></div>
                <div class="body"></div>
            `;
            messages.appendChild(item);
            window.scrollTo(0, document.body.scrollHeight);

            streamingMessages.set(data.replyId, {
                bodyEl: item.querySelector('.body'),
                rawText: ''
            });
        });

        socket.on('companion message chunk', (data) => {
            const entry = streamingMessages.get(data.replyId);
            if (!entry) return;
            entry.rawText += data.delta;
            entry.bodyEl.textContent = entry.rawText; // plain text while streaming
            window.scrollTo(0, document.body.scrollHeight);
        });

        socket.on('companion message end', async (data) => {
            const entry = streamingMessages.get(data.replyId);
            streamingMessages.delete(data.replyId);
            if (!entry) return;

            const { bodyEl } = entry;
            const finalText = data.text ?? entry.rawText;
            const item = bodyEl.closest('li');

            if (data.error) {
                bodyEl.textContent = finalText;
                window.scrollTo(0, document.body.scrollHeight);
                return;
            }

            bodyEl.innerHTML = renderAiText(finalText);
            window.scrollTo(0, document.body.scrollHeight);
            if (item) addSpeakButton(item, bodyEl, () => finalText);

            // Same translate step the regular message flow does, just applied
            // after the fact instead of blocking the initial render.
            const targetLang = langSelect.value;
            try {
                const response = await fetch(`/api/translate?text=${encodeURIComponent(finalText)}&target=${targetLang}`);
                const result = await response.json();
                if (result.translatedText) {
                    bodyEl.innerHTML = `
                        <strong>Original (${escapeHtml(result.fromLang)}):</strong> ${renderAiText(finalText)}<br>
                        <strong>Translated (${escapeHtml(targetLang)}):</strong> ${renderAiText(result.translatedText)}
                    `;
                    window.scrollTo(0, document.body.scrollHeight);
                }
            } catch (err) {
                // Keep showing the untranslated rendered reply — no need to surface this
            }
        });

        // Receive incoming messages and translate according to user's selected language
        socket.on('chat message', async (data) => {
            const targetLang = langSelect.value;
            const isOwn = data.clientId === clientId;
            const isSystem = data.senderId === 'SYSTEM';

            if (data.senderId) {
                typingUsers.delete(data.senderId);
                renderTypingState();
            }

            if (isSystem) {
                addSystemNote(data.text);
                return;
            }

            const item = document.createElement('li');
            item.className = isOwn ? 'own' : 'other';

            // Own messages: skip translation, show as-is
            if (isOwn) {
                item.innerHTML = `
                    <div class="meta"><span class="name">${escapeHtml(data.username || 'You')}</span><span class="time">${formatTime(data.timestamp)}</span></div>
                    <div class="body">${escapeHtml(data.text)}</div>
                `;
                messages.appendChild(item);
                window.scrollTo(0, document.body.scrollHeight);
                return;
            }

            item.innerHTML = `
                <div class="meta"><span class="name">${escapeHtml(data.username || 'Stranger')}</span><span class="time">${formatTime(data.timestamp)}</span></div>
                <div class="body"><strong>Original:</strong> ${escapeHtml(data.text)}<br><em>Translating...</em></div>
            `;
            messages.appendChild(item);
            window.scrollTo(0, document.body.scrollHeight);

            const bodyEl = item.querySelector('.body');

            try {
                const response = await fetch(`/api/translate?text=${encodeURIComponent(data.text)}&target=${targetLang}`);
                const result = await response.json();

                if (result.translatedText) {
                    bodyEl.innerHTML = `
                        <strong>Original (${escapeHtml(result.fromLang)}):</strong> ${escapeHtml(data.text)}<br>
                        <strong>Translated (${escapeHtml(targetLang)}):</strong> ${escapeHtml(result.translatedText)}
                    `;
                } else {
                    bodyEl.innerHTML = escapeHtml(data.text);
                }
            } catch (err) {
                bodyEl.innerHTML = escapeHtml(data.text);
            }

            window.scrollTo(0, document.body.scrollHeight);
        });
    </script>
</body>
</html>
